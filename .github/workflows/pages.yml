# GitHub Pages cannot host the Stripe/Graph API routes.
# This workflow only verifies pricing/slots and that `next build` succeeds.
# Do not upload `out/` — the app is no longer a static export.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify pricing
        run: npm run verify:pricing
      - name: Verify visit slots
        run: npm run verify:slots
      - name: Build
        run: npm run build

  # Left in place so a Pages-only misclick cannot break the Vercel app.
  # Static export is gated behind GITHUB_PAGES=1 and is not used for booking.
  pages:
    if: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - run: echo "GitHub Pages deploy disabled; APIs run on Vercel."
